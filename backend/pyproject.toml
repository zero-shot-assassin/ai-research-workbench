[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.126",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
